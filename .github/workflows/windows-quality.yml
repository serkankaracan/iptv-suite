name: Windows quality

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_native_client:
        description: Run the native Tier A smoke on an approved x64 Windows Client runner
        required: false
        default: false
        type: boolean
      run_wack:
        description: Run the development-identity WACK preflight without closing the final WACK blocker
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  quality:
    name: Locked build and test gate
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.302"
          cache: true
          cache-dependency-path: apps/windows/**/packages.lock.json

      - name: Verify exact .NET SDK
        shell: pwsh
        run: |
          $actualSdk = (dotnet --version).Trim()
          if ($actualSdk -ne "10.0.302") {
            throw "Expected .NET SDK 10.0.302, received '$actualSdk'."
          }

      - name: Run Windows quality gate and artifact scanner
        shell: pwsh
        run: .\eng\Invoke-WindowsQualityGate.ps1

      - name: Upload sanitized quality evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-quality-evidence
          path: |
            .artifacts/quality-gates/evidence/quality-summary.json
            .artifacts/quality-gates/fixtures/run-1/fixture-manifest.json
            .artifacts/quality-gates/fixtures/LICENSES/LicenseRef-IPTVSuite-Synthetic-Test-Only.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  package-smoke:
    name: Packaged install and launch smoke
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.302"
          cache: true
          cache-dependency-path: apps/windows/**/packages.lock.json

      - name: Verify exact .NET SDK
        shell: pwsh
        run: |
          $actualSdk = (dotnet --version).Trim()
          if ($actualSdk -ne "10.0.302") {
            throw "Expected .NET SDK 10.0.302, received '$actualSdk'."
          }

      - name: Restore locked dependencies
        shell: pwsh
        run: >-
          dotnet restore .\apps\windows\IptvSuite.Windows.sln
          --locked-mode
          --configfile .\NuGet.config
          -p:Platform=x64
          --nologo

      - name: Install exact package SBOM tool
        shell: pwsh
        run: >-
          dotnet tool install Microsoft.Sbom.DotNetTool
          --version 4.1.5
          --tool-path .\.artifacts\windows-package-sbom-tool
          --configfile .\NuGet.config

      - name: Build, scan, install, launch, and remove signed MSIX
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_wack }}
        shell: powershell
        run: .\eng\Invoke-WindowsPackageSmoke.ps1 -Configuration Release

      - name: Build, scan, install, launch, run development WACK preflight, and remove signed MSIX
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_wack }}
        shell: powershell
        run: .\eng\Invoke-WindowsPackageSmoke.ps1 -Configuration Release -RunWack

      - name: Verify packaged protected-store process lifecycle
        shell: powershell
        run: .\eng\Invoke-WindowsPackageLifecycleSmoke.ps1 -Configuration Release

      - name: Scan packaged-smoke evidence
        shell: pwsh
        run: |
          dotnet build .\apps\windows\tests\IptvSuite.Testing\IptvSuite.Testing.csproj `
            -c Release `
            --no-restore `
            --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "The packaged-smoke evidence scanner build failed."
          }
          dotnet .\apps\windows\tests\IptvSuite.Testing\bin\Release\net10.0\IptvSuite.Testing.dll `
            scan-artifacts .\.artifacts\msix-smoke CI PACKAGE_EVIDENCE
          if ($LASTEXITCODE -ne 0) {
            throw "The packaged-smoke evidence scan failed."
          }
          dotnet .\apps\windows\tests\IptvSuite.Testing\bin\Release\net10.0\IptvSuite.Testing.dll `
            scan-artifacts .\.artifacts\package-lifecycle M4 PACKAGE_LIFECYCLE_EVIDENCE
          if ($LASTEXITCODE -ne 0) {
            throw "The packaged lifecycle evidence scan failed."
          }

      - name: Upload sanitized packaged smoke evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msix-smoke-evidence
          path: |
            .artifacts/msix-smoke/last-success.json
            .artifacts/msix-smoke/package-sbom.spdx.json
            .artifacts/msix-smoke/package-sbom-summary.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload sanitized packaged lifecycle evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-package-lifecycle-evidence
          path: .artifacts/package-lifecycle/last-success.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload sanitized development-identity WACK preflight evidence
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.run_wack }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-wack-development-preflight-evidence
          path: .artifacts/msix-smoke/wack-development-preflight-summary.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7


  native-playback:
    name: Native Tier A packaged playback smoke (Windows Client)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_native_client }}
    needs:
      - quality
      - package-smoke
      - dpapi-user-boundary
    runs-on:
      - self-hosted
      - Windows
      - X64
      - iptv-windows-client
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify x64 Windows Client runner
        shell: powershell
        run: |
          $installationType = (Get-ItemProperty `
            -LiteralPath "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion" `
            -Name InstallationType).InstallationType
          if ($installationType -cne "Client" -or
              -not [Environment]::Is64BitOperatingSystem -or
              $env:PROCESSOR_ARCHITECTURE -cne "AMD64") {
            throw "Native Tier A smoke requires an x64 Windows Client runner."
          }

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.302"
          cache: true
          cache-dependency-path: apps/windows/**/packages.lock.json

      - name: Verify exact .NET SDK
        shell: pwsh
        run: |
          $actualSdk = (dotnet --version).Trim()
          if ($actualSdk -ne "10.0.302") {
            throw "Expected .NET SDK 10.0.302, received '$actualSdk'."
          }

      - name: Restore locked dependencies
        shell: pwsh
        run: >-
          dotnet restore .\apps\windows\IptvSuite.Windows.sln
          --locked-mode
          --configfile .\NuGet.config
          -p:Platform=x64
          --nologo

      - name: Verify packaged native Tier A playback
        shell: powershell
        run: >-
          .\eng\Invoke-WindowsNativePlaybackSmoke.ps1
          -Configuration Release
          -SwitchCount 100
          -SoakMinutes 0
          -NetworkInterruptionCount 1
          -CancellationProbeCount 1

      - name: Scan native playback evidence
        shell: pwsh
        run: |
          $evidencePath = ".\.artifacts\native-playback-smoke\last-success.json"
          dotnet build .\apps\windows\tests\IptvSuite.Testing\IptvSuite.Testing.csproj `
            -c Release `
            --no-restore `
            --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "The native playback evidence scanner build failed."
          }
          dotnet .\apps\windows\tests\IptvSuite.Testing\bin\Release\net10.0\IptvSuite.Testing.dll `
            validate-native-playback-evidence `
            $evidencePath `
            .\eng\Invoke-WindowsNativePlaybackSmoke.ps1 `
            $env:GITHUB_SHA.ToLowerInvariant() `
            10.0.302
          if ($LASTEXITCODE -ne 0) {
            throw "The native playback evidence contract validation failed."
          }
          dotnet .\apps\windows\tests\IptvSuite.Testing\bin\Release\net10.0\IptvSuite.Testing.dll `
            scan-artifacts .\.artifacts\native-playback-smoke M10 NATIVE_PLAYBACK_EVIDENCE
          if ($LASTEXITCODE -ne 0) {
            throw "The native playback evidence scan failed."
          }

      - name: Upload sanitized native playback evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-playback-evidence
          path: |
            .artifacts/native-playback-smoke/last-success.json
            .artifacts/native-playback-smoke/package-inventory.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  dpapi-user-boundary:
    name: DPAPI real-user boundary smoke
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.302"
          cache: true
          cache-dependency-path: apps/windows/**/packages.lock.json

      - name: Verify exact .NET SDK
        shell: pwsh
        run: |
          $actualSdk = (dotnet --version).Trim()
          if ($actualSdk -ne "10.0.302") {
            throw "Expected .NET SDK 10.0.302, received '$actualSdk'."
          }

      - name: Restore locked dependencies
        shell: pwsh
        run: >-
          dotnet restore .\apps\windows\IptvSuite.Windows.sln
          --locked-mode
          --configfile .\NuGet.config
          -p:Platform=x64
          --nologo

      - name: Verify DPAPI CurrentUser real-account boundary
        shell: powershell
        run: .\eng\Invoke-WindowsDpapiUserBoundarySmoke.ps1 -Configuration Release

      - name: Upload sanitized DPAPI user-boundary evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-dpapi-user-boundary-evidence
          path: .artifacts/dpapi-user-boundary/last-success.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  required-gate:
    name: Required Windows gate
    if: ${{ always() }}
    needs:
      - quality
      - package-smoke
      - native-playback
      - dpapi-user-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every applicable Windows job to pass
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
          NATIVE_PLAYBACK_RESULT: ${{ needs.native-playback.result }}
          NATIVE_PLAYBACK_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.run_native_client }}
          DPAPI_USER_BOUNDARY_RESULT: ${{ needs.dpapi-user-boundary.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$PACKAGE_SMOKE_RESULT" = "success"
          test "$DPAPI_USER_BOUNDARY_RESULT" = "success"
          if [ "$NATIVE_PLAYBACK_REQUESTED" = "true" ]; then
            test "$NATIVE_PLAYBACK_RESULT" = "success"
          else
            test "$NATIVE_PLAYBACK_RESULT" = "skipped"
          fi
